global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "opspilot"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["opspilot:8000"]
        labels:
          environment: "production"
          service: "opspilot-core"

  - job_name: "payment-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payment-api:8080"]
        labels:
          environment: "production"
          service: "payment-api"
