services:
  opspilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opspilot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_TIMEOUT_SECONDS=10.0
      - TARGET_SERVICE_NAME=payment-api
      - TARGET_SERVICE_URL=http://payment-api:8080
      - TARGET_CONTAINER_NAME=payment-api
      - POLICY_FILE=/app/policies/remediation.yaml
      - ANSIBLE_INVENTORY=/app/ansible/inventory/hosts.yml
      - ANSIBLE_PLAYBOOKS_DIR=/app/ansible/playbooks
      - AUDIT_LOG_FILE=/app/logs/audit.log
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs
    depends_on:
      payment-api:
        condition: service_healthy
    networks:
      - opspilot-net

  payment-api:
    build:
      context: ./simulator/sample-api
      dockerfile: Dockerfile
    container_name: payment-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      - opspilot-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - opspilot-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - opspilot-net

volumes:
  ollama_data:

networks:
  opspilot-net:
    driver: bridge
